<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 24 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 24</h1>
        <p style="color: #9c27b0; font-size: 0.9rem;">[ Very Hard ]</p>

        <!-- Ters Yazılmış Metin -->
        <div style="background: #05070a; border: 1px solid #1a1d2e; padding: 20px; border-radius: 8px; margin: 30px 0; font-family: monospace; color: #00ff88; font-size: 1.2rem; letter-spacing: 3px;">
            _yrots_eht_fo_dne_ehT
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script>
        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim();
            const msgBox = document.getElementById("feedback-msg");

            // Ters çevrilmiş cevap: The_end_of_the_story_
            if (inputVal === "The_end_of_the_story_") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "The_end_of_the_story_.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff3366";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
