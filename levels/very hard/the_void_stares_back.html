<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 23 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .signal-box {
            background: #000;
            border: 1px solid #ff0055;
            padding: 30px;
            border-radius: 8px;
            margin: 30px 0;
            font-family: monospace;
            font-size: 1.5rem;
            color: #ff0055;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ff0055;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 23</h1>
        <p style="color: #9c27b0; font-size: 0.9rem;">[ Very Hard ]</p>

        <!-- Mors Kodu Alanı -->
        <div class="signal-box">
            ... .. --. -. .- .-..
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script>
        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim().toLowerCase();
            const msgBox = document.getElementById("feedback-msg");

            if (inputVal === "signal") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "signal.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff3366";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
