<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 28 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 28</h1>
        <p style="color: #9c27b0; font-size: 0.9rem;">[ Very Hard ]</p>

        <!-- Sezar Şifreli Metin -->
        <div style="background: #05070a; border: 1px solid #1a1d2e; padding: 25px; border-radius: 8px; margin: 30px 0; font-family: monospace; color: #ff5500; font-size: 1.2rem; letter-spacing: 3px;">
            btift_p3_dpef
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>
    </div><BR>

    <p style="font-size: 0.75rem; color: #fff0ff; margin-top: 20px;">
    // ROC -1
</p>

    <script>
        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim().toLowerCase();
            const msgBox = document.getElementById("feedback-msg");

            // -1 Harf Kaydırma Çözümü: ashes_o2_code
            if (inputVal === "ashes_o2_code") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "ashes_o2_code.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff3366";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
