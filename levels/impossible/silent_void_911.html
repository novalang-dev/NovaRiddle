<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 32 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .ghost-node {
            width: 100%;
            height: 100px;
            background: #020305;
            border: 1px solid #0f172a;
            border-radius: 8px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Şifre doğrudan CSS pseudo-elementine gömülü */
        .ghost-node::after {
            content: "eDA2X3RoZV9lbXB0eV9zcGFjZQ==";
            color: #0f172a; /* Neredeyse görünmez koyu renk */
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 32</h1>
        <p style="color: #ff0055; font-size: 0.9rem;">[ IMPOSSIBLE ]</p>

        <!-- Hayalet Düğüm Alanı -->
        <div class="ghost-node"></div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.7rem; color: #0f172a; margin-top: 25px;">
            // styles -> .ghost-node::after
        </p>
    </div>

    <script>
        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim();
            const msgBox = document.getElementById("feedback-msg");

            // Base64 (eDA2X3RoZV9lbXB0eV9zcGFjZQ==) Çözümü: x06_the_empty_space
            if (inputVal === "x06_the_empty_space") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "x06_the_empty_space.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff0055";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
