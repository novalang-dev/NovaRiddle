<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 33 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .void-frequency {
            width: 100%;
            height: 60px;
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 5px,
                #ff0055 5px,
                #ff0055 10px
            );
            border-radius: 4px;
            margin: 30px 0;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="card" data-frequency="440Hz" data-payload="c2lsZW50X3ZvaWRfOTEx">
        <h1>BÖLÜM 31</h1>
        <p style="color: #ff0055; font-size: 0.9rem;">[ IMPOSSIBLE ]</p>

        <!-- Frekans Görsel Temsili -->
        <div class="void-frequency"></div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.7rem; color: #1a1d2e; margin-top: 25px;">
            // inspect elements -> root container
        </p>
    </div>

    <script>
        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim();
            const msgBox = document.getElementById("feedback-msg");

            // Base64 (c2lsZW50X3ZvaWRfOTEx) Çözümü: silent_void_911
            if (inputVal === "silent_void_911") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "silent_void_911.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff0055";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
