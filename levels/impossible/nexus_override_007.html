<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 47 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .nexus-box {
            border: 2px solid #06b6d4;
            background: rgba(6, 182, 212, 0.05);
            padding: 30px;
            border-radius: 8px;
            margin: 30px 0;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .nexus-title {
            font-family: monospace;
            color: #22d3ee;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 47</h1>
        <p style="color: #06b6d4; font-size: 0.9rem;">[ NEXUS OVERRIDE ]</p>

        <!-- Nexus Düğüm Alanı -->
        <div class="nexus-box">
            <p class="nexus-title">🔗 [NEXUS_LINK_ACTIVE] 🔗</p>
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.7rem; color: #1e293b; margin-top: 25px;">
            // console -> NexusNode.core
        </p>
    </div>

    <script>
        // ES6 Proxy kullanarak özellikte tuzaklama
        const target = {
            _secret: "Y29zbWljX2dhdGV3YXlfOTk5" // Base64
        };

        window.NexusNode = new Proxy(target, {
            get: function(obj, prop) {
                if (prop === 'core') {
                    const decoded = atob(obj._secret);
                    console.log("%c[NEXUS_OVERRIDE_SUCCESS]: " + decoded, "color: #22d3ee; font-weight: bold; font-size: 1rem;");
                    return decoded;
                }
                return obj[prop];
            }
        });

        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim().toLowerCase();
            const msgBox = document.getElementById("feedback-msg");

            // Base64 (Y29zbWljX2dhdGV3YXlfOTk5) Çözümü: cosmic_gateway_999
            if (inputVal === "cosmic_gateway_999") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "cosmic_gateway_999.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff0055";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
