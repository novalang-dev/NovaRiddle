<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 36 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .quantum-box {
            background: #000;
            border: 1px solid #00f0ff;
            padding: 30px;
            border-radius: 8px;
            margin: 30px 0;
            font-family: monospace;
            color: #00f0ff;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 36</h1>
        <p style="color: #ff0055; font-size: 0.9rem;">[ IMPOSSIBLE ]</p>

        <!-- Kuantum Durum Sembolü -->
        <div class="quantum-box">
            |Ψ⟩ = α|0⟩ + β|1⟩
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.7rem; color: #0f172a; margin-top: 25px;">
            // console -> console.log(quantumState.join('_'))
        </p>
    </div>

    <script>
        // Konsolda birleştirilmesi gereken kuantum dizisi parçaları
        window.quantumState = ["entangled", "singularity", "101"];

        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim().toLowerCase();
            const msgBox = document.getElementById("feedback-msg");

            // Dizinin alt tire ile birleşimi: entangled_singularity_101
            if (inputVal === "entangled_singularity_101") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "entangled_singularity_101.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff0055";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
