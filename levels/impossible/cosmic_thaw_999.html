<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 41 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .thaw-box {
            border: 1px solid #ffaa00;
            background: rgba(255, 170, 0, 0.05);
            padding: 30px;
            border-radius: 8px;
            margin: 30px 0;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        .thaw-text {
            font-family: monospace;
            color: #ffaa00;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 41</h1>
        <p style="color: #ffaa00; font-size: 0.9rem;">[ COSMIC THAW ]</p>

        <!-- Çözülme / Erime Alanı -->
        <div class="thaw-box">
            <p class="thaw-text">🔥 [HEAT_INDEX: RISING] 🔥</p>
        </div>

        <!-- Etkileşim Alanı -->
        <div style="margin: 20px 0;">
            <input type="text" id="user-answer" placeholder="..." autocomplete="off">
            <button onclick="checkAnswer()">></button>
            <div id="feedback-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.7rem; color: #1e293b; margin-top: 25px;">
            // inspect Application/Storage -> sessionStorage['cosmic_core']
        </p>
    </div>

    <script>
        // SessionStorage içine şifreli anahtar enjekte ediliyor
        sessionStorage.setItem('cosmic_core', 'c3VwZXJub3ZhX2NvcmVfMDAw'); // Base64

        function checkAnswer() {
            const inputVal = document.getElementById("user-answer").value.trim().toLowerCase();
            const msgBox = document.getElementById("feedback-msg");

            // Base64 (c3VwZXJub3ZhX2NvcmVfMDAw) Çözümü: supernova_core_000
            if (inputVal === "supernova_core_000") {
                msgBox.style.color = "#00ff88";
                msgBox.textContent = "OK";
                
                setTimeout(() => {
                    window.location.href = "supernova_core_000.html";
                }, 1000);
            } else {
                msgBox.style.color = "#ff0055";
                msgBox.textContent = "ERR";
            }
        }

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
