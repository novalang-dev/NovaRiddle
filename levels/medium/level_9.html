<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 9 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 9</h1>
        <p style="color: #8a8fbd; font-size: 0.9rem;">[ Orta Seviye ]</p>

        <div style="margin: 30px 0;">
            <input type="text" id="access-code" placeholder="Erişim kodunu girin..." autocomplete="off">
            <button onclick="verifyCode()">ONAYLA</button>
            <div id="status" style="margin-top: 15px; font-weight: bold; font-size: 0.95rem;"></div>
        </div>

        <p style="font-size: 0.8rem; color: #4a4f6e;">
            // Mantığı tersten çalıştır.
        </p>
    </div>

    <script>
        function verifyCode() {
            const val = document.getElementById("access-code").value.trim().toLowerCase();
            const status = document.getElementById("status");
            
            // 'level_10' yazıldığında terse çevrilince '01_level' elde edilir.
            const reversed = val.split('').reverse().join('');

            if (reversed === "01_level") {
                status.style.color = "#00ff88";
                status.textContent = "KOD DOĞRULANDI! Yönlendiriliyorsunuz...";
                setTimeout(() => {
                    window.location.href = "level_10.html";
                }, 1200);
            } else {
                status.style.color = "#ff3366";
                status.textContent = "ERİŞİM REDDEDİLDİ.";
            }
        }

        // Enter tuşu desteği
        document.getElementById("access-code").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyCode();
            }
        });
    </script>
</body>
</html>
