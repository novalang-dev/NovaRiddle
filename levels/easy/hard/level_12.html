<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 12 - Nova Riddle</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="card">
        <h1>BÖLÜM 12</h1>
        <p style="color: #ff0055; font-size: 0.9rem;">[ Zor Seviye: Veri Katmanı ]</p>

        <div style="background: #090a0f; border: 1px solid #1a1d2e; padding: 25px; border-radius: 8px; margin: 30px 0;">
            <p id="status-text" style="font-family: monospace; color: #8a8fbd; font-size: 0.95rem; margin: 0;">
                KİLİTLİ DEPO: Yerel bellek verisi okunuyor...
            </p>
        </div>

        <div style="margin: 20px 0;">
            <input type="text" id="storage-pass" placeholder="Depo anahtarını gir..." autocomplete="off">
            <button onclick="checkStorageKey()">ÇÖZ</button>
            <div id="msg" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <p style="font-size: 0.8rem; color: #4a4f6e;">
            // Depolama alanı (Local Storage) verilerini kontrol et.
        </p>
    </div>

    <script>
        // Sayfa yüklendiğinde yerel depolamaya anahtar eklenir
        localStorage.setItem("nova_vault_key", "kripto_katmani_13");

        function checkStorageKey() {
            const input = document.getElementById("storage-pass").value.trim();
            const msg = document.getElementById("msg");

            if (input === "kripto_katmani_13") {
                msg.style.color = "#00ff88";
                msg.textContent = "ANAHTAR DOĞRULANDI! Yönlendiriliyorsunuz...";
                setTimeout(() => {
                    window.location.href = "level_13.html";
                }, 1200);
            } else {
                msg.style.color = "#ff3366";
                msg.textContent = "GEÇERSİZ ANAHTAR!";
            }
        }

        document.getElementById("storage-pass").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkStorageKey();
        });
    </script>
</body>
</html>
